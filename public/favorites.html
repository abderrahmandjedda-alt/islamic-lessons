<script src="lucide.min.js"></script>
<script src="data.js"></script>
<script src="app.js?v=32"></script>
<script>
// ═══════════════════════════════════════════════
// ⭐ صفحة المفضلة
// ═══════════════════════════════════════════════
(function () {
  'use strict';

  let serverLessons = [];
  let lessonsLoaded = false;
  let loadFailed = false;
  let loadAttempts = 0;

  async function loadLessons() {
    loadAttempts++;
    try {
      const res = await fetch('/api/lessons');
      if (!res.ok) throw new Error('استجابة غير صالحة');
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('بيانات غير صالحة');

      serverLessons = data;
      lessonsLoaded = true;
      loadFailed = false;

      const favs = getFavorites();
      const existingIds = serverLessons.map(l => l.id);
      const cleaned = favs.lessons.filter(id => existingIds.includes(id));
      if (cleaned.length !== favs.lessons.length) {
        favs.lessons = cleaned;
        saveFavorites(favs);
      }
    } catch (err) {
      console.error('تعذر جلب الدروس:', err);
      if (loadAttempts < 5) setTimeout(loadLessons, 3000);
      else loadFailed = true;
    }
    renderFavorites();
  }

  function renderFavorites() {
    if (typeof getFavorites !== 'function') return;
    const favs = getFavorites();

    const specsList = document.getElementById('favSpecsList');
    const specCountEl = document.getElementById('specCount');
    if (specCountEl) specCountEl.textContent = `(${favs.specializations.length})`;

    if (specsList) {
      if (!favs.specializations.length) {
        specsList.innerHTML = `
          <div class="fav-empty">
            <span>${icon('inbox')}</span>
            <p>لا توجد تخصصات في المفضلة بعد</p>
            <a href="index.html">تصفح التخصصات وأضف</a>
          </div>`;
      } else {
        specsList.innerHTML = favs.specializations.map(fav => {
          const yearObj = (typeof YEARS !== 'undefined') ? YEARS.find(y => y.id === fav.year) : null;
          const yearName = yearObj ? yearObj.name : fav.year;
          const specEscaped = fav.spec.replace(/'/g, "\\'");
          return `
            <div class="fav-card">
              <div class="fav-card-content">
                <span class="fav-card-icon">${icon('graduation-cap')}</span>
                <div>
                  <h4>${fav.spec}</h4>
                  <p>${icon('calendar')} ${yearName}</p>
                </div>
              </div>
              <div class="fav-card-actions">
                <button onclick="window.goToSpecialization('${fav.year}', '${specEscaped}')" class="fav-go-btn">
                  ${icon('arrow-left')} اذهب
                </button>
                <button onclick="window.removeSpecFavorite('${fav.year}', '${specEscaped}')" class="fav-remove-btn" aria-label="إزالة من المفضلة">
                  ${icon('x')}
                </button>
              </div>
            </div>`;
        }).join('');
      }
    }

    const lessonsList = document.getElementById('favLessonsList');
    const lessonsCountEl = document.getElementById('lessonsCount');
    if (lessonsCountEl) lessonsCountEl.textContent = `(${favs.lessons.length})`;

    if (lessonsList) {
      if (!favs.lessons.length) {
        lessonsList.innerHTML = `
          <div class="fav-empty">
            <span>${icon('inbox')}</span>
            <p>لا توجد دروس مُعجَبة بعد</p>
            <a href="index.html">تصفح الدروس وأضف إعجاب</a>
          </div>`;
      } else {
        if (!lessonsLoaded) {
          lessonsList.innerHTML = loadFailed
            ? `<div class="fav-empty"><span>${icon('triangle-alert')}</span><p>تعذر تحميل الدروس الآن. أعد تحميل الصفحة بعد قليل.</p></div>`
            : `<div class="fav-empty"><span>${icon('hourglass')}</span><p>جارٍ تحميل الدروس...</p></div>`;
          return;
        }

        const favLessons = serverLessons.filter(l => favs.lessons.includes(l.id));
        if (!favLessons.length) {
          lessonsList.innerHTML = `
            <div class="fav-empty">
              <span>${icon('inbox')}</span>
              <p>الدروس المُعجَبة لم تعد متاحة</p>
            </div>`;
        } else {
          lessonsList.innerHTML = favLessons.map(l => {
            const title = (typeof escapeHtml === 'function') ? escapeHtml(l.title) : l.title;
            const subject = (typeof escapeHtml === 'function') ? escapeHtml(l.subject) : l.subject;
            return `
              <div class="fav-card">
                <div class="fav-card-content">
                  <span class="fav-card-icon">${icon('file-text')}</span>
                  <div>
                    <h4>${title}</h4>
                    <p>${icon('library')} ${subject}</p>
                  </div>
                </div>
                <div class="fav-card-actions">
                  <a href="${l.url}" target="_blank" class="fav-go-btn">${icon('eye')} فتح</a>
                  <button onclick="window.removeLessonFavorite('${l.id}')" class="fav-remove-btn" aria-label="إزالة من المفضلة">
                    ${icon('x')}
                  </button>
                </div>
              </div>`;
          }).join('');
        }
      }
    }
  }

  window.goToSpecialization = function (yearId, spec) {
    sessionStorage.setItem('goto_year', yearId);
    sessionStorage.setItem('goto_spec', spec);
    window.location.href = 'index.html';
  };

  window.removeSpecFavorite = function (yearId, spec) {
    if (typeof toggleFavoriteSpecialization === 'function') toggleFavoriteSpecialization(yearId, spec);
    renderFavorites();
  };

  window.removeLessonFavorite = function (lessonId) {
    if (typeof toggleFavoriteLesson === 'function') toggleFavoriteLesson(lessonId);
    renderFavorites();
  };

  function init() {
    loadLessons();
    renderFavorites();
  }

  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);
})();
</script>
<script src="modern-ui.js?v=32"></script>
