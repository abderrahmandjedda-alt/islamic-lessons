<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفضلتي - كلية العلوم الإسلامية</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
  <div class="container nav-wrap">
    <div class="logo" onclick="window.location.href='index.html'">
      <img src="lion.png" alt="جامعة وهران 1" class="logo-img">
      <div>
        <h1>كلية العلوم الإسلامية</h1>
        <p>جامعة وهران 1 أحمد بن بلة</p>
      </div>
    </div>
    <nav>
      <a href="index.html">🏠 الرئيسية</a>
      <button id="themeToggle" class="theme-btn">🌙</button>
    </nav>
  </div>
</header>

<section class="contact-hero">
  <div class="container">
    <span class="contact-hero-icon">⭐</span>
    <h1>مفضلتي</h1>
    <p>تخصصاتك المفضلة ودروسك المُعجَبة في مكان واحد</p>
  </div>
</section>

<section class="container contact-section">

  <div class="fav-section">
    <h2 class="fav-section-title">
      🎓 التخصصات المفضلة
      <span class="fav-count" id="specCount">(0)</span>
    </h2>
    <div id="favSpecsList" class="fav-list"></div>
  </div>

  <div class="fav-section">
    <h2 class="fav-section-title">
      ❤️ الدروس المُعجَبة
      <span class="fav-count" id="lessonsCount">(0)</span>
    </h2>
    <div id="favLessonsList" class="fav-list"></div>
  </div>

  <div class="contact-back">
    <a href="index.html" class="btn-back-large">🏠 العودة للرئيسية</a>
  </div>

</section>

<footer>
  <div class="container">
    <p class="footer-line">© 2025 — كلية العلوم الإسلامية | جامعة وهران 1 أحمد بن بلة</p>
    <p class="footer-author">إعداد: جدة عبد الرحمن</p>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
// ═══════════════════════════════════════════════
// ⭐ صفحة المفضلة - بدون إعادة تعريف أي متغير
// ═══════════════════════════════════════════════
// ملاحظة مهمة:
// - themeToggle و savedTheme معرّفتان في app.js
// - لا نعيد تعريفهما هنا
// - نستخدم window.themeToggle إذا احتجنا

(function() {
  'use strict';

  // ✏️ جديد: متغيرات خاصة بجلب الدروس
  let serverLessons = [];
  let lessonsLoaded = false;
  let loadFailed = false;
  let loadAttempts = 0;

  // ✏️ جديد: جلب الدروس وتنظيف المفضلة من الدروس المحذوفة
  async function loadLessons() {
    loadAttempts++;
    try {
      const res = await fetch('/api/lessons');
      if (!res.ok) throw new Error('استجابة غير صالحة');
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('بيانات غير صالحة');

      serverLessons = data;
      lessonsLoaded = true;
      loadFailed = false;

      // حذف الدروس المفضلة التي لم تعد موجودة على السيرفر
      const favs = getFavorites();
      const existingIds = serverLessons.map(l => l.id);
      const cleaned = favs.lessons.filter(id => existingIds.includes(id));
      if (cleaned.length !== favs.lessons.length) {
        favs.lessons = cleaned;
        saveFavorites(favs);
      }
    } catch (err) {
      console.error('تعذر جلب الدروس:', err);
      // لا نحذف أي شيء من المفضلة عند فشل الاتصال، ونعيد المحاولة
      if (loadAttempts < 5) {
        setTimeout(loadLessons, 3000);
      } else {
        loadFailed = true; // بعد 5 محاولات نعرض رسالة بدل الانتظار الأبدي
      }
    }
    renderFavorites();
  }
  
  // ═══════════════════════════════════════════════
  // عرض المفضلة
  // ═══════════════════════════════════════════════
  function renderFavorites() {
    // التحقق من وجود الدوال المطلوبة
    if (typeof getFavorites !== 'function') {
      console.error('getFavorites غير معرّفة');
      return;
    }
    
    const favs = getFavorites();
    
    // ==================== التخصصات ====================
    const specsList = document.getElementById('favSpecsList');
    const specCountEl = document.getElementById('specCount');
    
    if (specCountEl) {
      specCountEl.textContent = `(${favs.specializations.length})`;
    }
    
    if (specsList) {
      if (!favs.specializations.length) {
        specsList.innerHTML = `
          <div class="fav-empty">
            <span>📭</span>
            <p>لا توجد تخصصات في المفضلة بعد</p>
            <a href="index.html">تصفح التخصصات وأضف</a>
          </div>
        `;
      } else {
        specsList.innerHTML = favs.specializations.map(fav => {
          const yearObj = (typeof YEARS !== 'undefined') ? YEARS.find(y => y.id === fav.year) : null;
          const yearName = yearObj ? yearObj.name : fav.year;
          const specEscaped = fav.spec.replace(/'/g, "\\'");
          
          return `
            <div class="fav-card">
              <div class="fav-card-content">
                <span class="fav-card-icon">🎓</span>
                <div>
                  <h4>${fav.spec}</h4>
                  <p>📅 ${yearName}</p>
                </div>
              </div>
              <div class="fav-card-actions">
                <button onclick="window.goToSpecialization('${fav.year}', '${specEscaped}')" 
                        class="fav-go-btn">
                  🚀 اذهب
                </button>
                <button onclick="window.removeSpecFavorite('${fav.year}', '${specEscaped}')" 
                        class="fav-remove-btn">
                  ❌
                </button>
              </div>
            </div>
          `;
        }).join('');
      }
    }
    
    // ==================== الدروس ====================
    const lessonsList = document.getElementById('favLessonsList');
    const lessonsCountEl = document.getElementById('lessonsCount');
    
    if (lessonsCountEl) {
      lessonsCountEl.textContent = `(${favs.lessons.length})`;
    }
    
    if (lessonsList) {
      if (!favs.lessons.length) {
        lessonsList.innerHTML = `
          <div class="fav-empty">
            <span>📭</span>
            <p>لا توجد دروس مُعجَبة بعد</p>
            <a href="index.html">تصفح الدروس وأضف إعجاب</a>
          </div>
        `;
      } else {
        // ✏️ معدّل: نستخدم الدروس التي جلبناها بأنفسنا
        const allLessonsData = serverLessons;
        
        // ✏️ معدّل: نفرّق بين "لم يُحمَّل بعد" و"محمَّل وفارغ"
        if (!lessonsLoaded) {
          lessonsList.innerHTML = loadFailed
            ? `
              <div class="fav-empty">
                <span>⚠️</span>
                <p>تعذر تحميل الدروس الآن. أعد تحميل الصفحة بعد قليل.</p>
              </div>
            `
            : `
              <div class="fav-empty">
                <span>⏳</span>
                <p>جارٍ تحميل الدروس...</p>
              </div>
            `;
          // (لا حاجة لإعادة المحاولة هنا، تُعرض القائمة بعد انتهاء الجلب)
          return;
        }
        
        const favLessons = allLessonsData.filter(l => favs.lessons.includes(l.id));
        
        if (!favLessons.length) {
          lessonsList.innerHTML = `
            <div class="fav-empty">
              <span>📭</span>
              <p>الدروس المُعجَبة لم تعد متاحة</p>
            </div>
          `;
        } else {
          lessonsList.innerHTML = favLessons.map(l => {
            const title = (typeof escapeHtml === 'function') ? escapeHtml(l.title) : l.title;
            const subject = (typeof escapeHtml === 'function') ? escapeHtml(l.subject) : l.subject;
            
            return `
              <div class="fav-card">
                <div class="fav-card-content">
                  <span class="fav-card-icon">📄</span>
                  <div>
                    <h4>${title}</h4>
                    <p>📚 ${subject}</p>
                  </div>
                </div>
                <div class="fav-card-actions">
                  <a href="${l.url}" target="_blank" class="fav-go-btn">👁️ فتح</a>
                  <button onclick="window.removeLessonFavorite('${l.id}')" class="fav-remove-btn">
                    ❌
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }
      }
    }
  }
  
  // ═══════════════════════════════════════════════
  // الدوال العامة (window)
  // ═══════════════════════════════════════════════
  
  window.goToSpecialization = function(yearId, spec) {
    sessionStorage.setItem('goto_year', yearId);
    sessionStorage.setItem('goto_spec', spec);
    window.location.href = 'index.html';
  };
  
  window.removeSpecFavorite = function(yearId, spec) {
    if (typeof toggleFavoriteSpecialization === 'function') {
      toggleFavoriteSpecialization(yearId, spec);
    }
    renderFavorites();
  };
  
  window.removeLessonFavorite = function(lessonId) {
    if (typeof toggleFavoriteLesson === 'function') {
      toggleFavoriteLesson(lessonId);
    }
    renderFavorites();
  };
  
  // ═══════════════════════════════════════════════
  // تشغيل عند التحميل
  // ═══════════════════════════════════════════════
  function init() {
    loadLessons(); // ✏️ جديد
    renderFavorites();
  }
  
  if (document.readyState === 'complete') {
    init();
  } else {
    window.addEventListener('load', init);
  }
})();
</script>
</body>
</html>
