<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — رفع الدروس</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    .admin-icon { width: 1.2em; height: 1.2em; stroke-width: 1.9; flex-shrink: 0; vertical-align: middle; }
    .navbar nav a, .theme-btn, .btn-refresh, .btn-primary, .pending-btn,
    .btn-view, .btn-delete, .review-title, .upload-card h3, .manage-card h3,
    .login-box h3, .review-login-box h4 {
      display: inline-flex; align-items: center; gap: 8px;
    }
    .theme-btn { justify-content: center; }
    .btn-view, .btn-delete { justify-content: center; }
    .btn-delete svg, .pending-btn.reject svg { color: #b42318; }
    .pending-btn.approve svg { color: var(--emerald); }
    .review-title > i, .upload-card h3 svg, .manage-card h3 svg { color: var(--gold-dark); }
    [data-theme="dark"] .review-title > i,
    [data-theme="dark"] .upload-card h3 svg,
    [data-theme="dark"] .manage-card h3 svg { color: var(--gold); }

    .user-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(0,0,0,.05); font-size: 14px; margin-inline-start: 8px;
    }
    [data-theme="dark"] .user-chip { background: rgba(255,255,255,.08); }
    .user-name { font-weight: 700; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-chip .btn-refresh { padding: 4px 10px; font-size: 13px; cursor: pointer; }

    .login-field-label {
      display: block; text-align: right; margin-bottom: 6px;
      font-size: 13px; color: var(--text-light);
    }
    #loginForm input { margin-bottom: 14px; }
  </style>
</head>
<body>

<header class="navbar">
  <div class="container nav-wrap">
    <div class="logo">
      <img src="lion.png" alt="جامعة وهران 1" class="logo-img">
      <div><h1>لوحة التحكم</h1><p>رفع وإدارة الدروس</p></div>
    </div>
    <nav>
      <a href="index.html"><i data-lucide="house" class="admin-icon"></i> الرئيسية</a>
      <div id="userChip" class="user-chip" style="display:none;">
        <span id="userNameLabel" class="user-name"></span>
        <button id="logoutBtn" class="btn-refresh" type="button">
          <i data-lucide="log-out" class="admin-icon"></i> خروج
        </button>
      </div>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="تبديل الوضع الليلي">
        <i data-lucide="moon" class="admin-icon"></i>
      </button>
    </nav>
  </div>
</header>

<!-- شاشة الدخول -->
<div id="loginScreen" class="container section">
  <div class="login-box">
    <h3><i data-lucide="shield-check" class="admin-icon"></i> الدخول إلى لوحة التحكم</h3>
    <p>أدخل بريدك وكلمة السر</p>

    <form id="loginForm" autocomplete="on">
      <label class="login-field-label" for="emailInput">البريد الإلكتروني</label>
      <div class="email-field-wrap">
        <input
          type="email"
          id="emailInput"
          name="email"
          placeholder="example@gmail.com"
          autocomplete="username email"
          dir="ltr"
          required
        >
        <button type="button" id="emailDropdownToggle" class="email-drop-toggle" aria-label="عرض الحسابات المحفوظة">
          <i data-lucide="chevron-down" class="admin-icon"></i>
        </button>
        <div id="emailDropdown" class="email-dropdown" style="display:none;"></div>
      </div>

      <label class="login-field-label" for="passwordInput">كلمة السر</label>
      <input
        type="password"
        id="passwordInput"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" class="btn-primary" type="submit">
        <i data-lucide="log-in" class="admin-icon"></i> دخول
      </button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
</div>

<!-- لوحة التحكم -->
<div id="adminPanel" class="container section" style="display:none;">

  <div class="review-card">
    <div class="review-header">
      <div class="review-title">
        <i data-lucide="inbox" class="admin-icon"></i>
        <div>
          <h3>الدروس بانتظار المراجعة</h3>
          <p class="review-subtitle"><span id="pendingCount">0</span> درس</p>
        </div>
      </div>
      <button id="refreshPendingBtn" class="btn-refresh" type="button">
        <i data-lucide="refresh-cw" class="admin-icon"></i> تحديث
      </button>
    </div>

    <div id="reviewLoginScreen" class="review-login">
      <div class="review-login-box">
        <i data-lucide="lock-keyhole" class="admin-icon"></i>
        <h4>الدخول إلى قسم المراجعة</h4>
        <p>أدخل كلمة سر المراجعة</p>
        <input type="password" id="reviewPasswordInput" placeholder="كلمة سر المراجعة" autocomplete="current-password">
        <button id="reviewLoginBtn" class="btn-primary" type="button">
          <i data-lucide="log-in" class="admin-icon"></i> دخول
        </button>
        <p id="reviewLoginError" class="error"></p>
      </div>
    </div>

    <div id="pendingList" class="pending-list" style="display:none;"></div>
  </div>

  <div class="upload-card">
    <h3><i data-lucide="cloud-upload" class="admin-icon"></i> رفع درس جديد</h3>
    <form id="uploadForm">
      <label for="yearSelect">السنة الدراسية</label>
      <select name="year" id="yearSelect" required><option value="">اختر السنة</option></select>

      <label for="specializationSelect">التخصص</label>
      <select name="specialization" id="specializationSelect" required><option value="">اختر السنة أولاً</option></select>

      <label for="subjectSelect">المادة</label>
      <select name="subject" id="subjectSelect" required><option value="">اختر التخصص أولاً</option></select>

      <label for="lessonTitle">عنوان الدرس</label>
      <input id="lessonTitle" type="text" name="title" required placeholder="مثال: المدخل إلى الحضارة الإسلامية">

      <label for="lessonDescription">وصف مختصر (اختياري)</label>
      <textarea id="lessonDescription" name="description" rows="3" placeholder="وصف موجز عن الدرس"></textarea>

      <label for="lessonFile">الملف (PDF أو Word)</label>
      <input id="lessonFile" type="file" name="file" accept=".pdf,.doc,.docx" required>

      <button type="submit" class="btn-primary">
        <i data-lucide="upload" class="admin-icon"></i> رفع الدرس
      </button>
      <p id="uploadStatus" class="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="manage-card">
    <h3><i data-lucide="library-big" class="admin-icon"></i> إدارة الدروس المرفوعة</h3>
    <div id="adminLessons"></div>
  </div>

</div>

<footer>
  <div class="container">
    <p class="footer-line">© 2025 — كلية العلوم الإسلامية | جامعة وهران 1 أحمد بن بلة</p>
    <p class="footer-author">إعداد: جدة عبد الرحمن</p>
  </div>
</footer>

<script src="data.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.lucide) window.lucide.createIcons();
  });
</script>
</body>
</html>
